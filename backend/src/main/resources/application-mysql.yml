spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_event_hub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  security:
    initial-admin:
      username: ${ADMIN_INITIAL_USERNAME:admin}
      password: ${ADMIN_INITIAL_PASSWORD}
      display-name: ${ADMIN_INITIAL_DISPLAY_NAME:内容管理员}
    initial-organizer:
      organizer-id: ${ORGANIZER_INITIAL_ID:1}
      username: ${ORGANIZER_INITIAL_USERNAME:}
      password: ${ORGANIZER_INITIAL_PASSWORD:}
      display-name: ${ORGANIZER_INITIAL_DISPLAY_NAME:}
